[project]
name = "worker-visualizations-py"
version = "0.1.0"
description = "Visualization transform worker: consumes NATS jobs, builds datamapplot HTML, uploads to S3."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Machine learning and visualization
    "umap-learn==0.5.12",
    "fast-hdbscan==0.3.2",
    "datamapplot==0.7.3",
    # Core dependencies
    # Constraint: qdrant-client requires numpy>=1.26; numba 0.65 requires numpy<2.4
    "numpy>=1.26,<2.4",
    "pydantic==2.13.3",
    # NATS messaging
    "nats-py==2.14.0",
    # Vector database client
    "qdrant-client==1.18.0",
    # LLM providers
    "cohere==7.0.2",
    "openai==2.38.0",
    "httpx==0.28.1",
    # AWS S3 storage
    "boto3==1.43.18",
    # Environment variables
    "python-dotenv==1.2.2",
    # HTTP server and async framework
    "aiohttp==3.14.0",
    "prometheus-client==0.25.0",
    # Observability - OpenTelemetry
    "opentelemetry-api==1.42.1",
    "opentelemetry-sdk==1.42.1",
    "opentelemetry-exporter-otlp==1.42.1",
    "opentelemetry-instrumentation",
    "opentelemetry-instrumentation-requests",
    "opentelemetry-instrumentation-aiohttp-client",
    "opentelemetry-exporter-prometheus",
    # Jaeger thrift dependencies
    "thrift==0.23.0",
    "deprecated==1.3.1",
    # JIT compilation (pinned for Python 3.12 compatibility)
    "numba>=0.65.1",
]