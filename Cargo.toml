[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/core",
    "crates/embedding-inference-api",
    "crates/llm-inference-api",
    "crates/worker-collections",
    "crates/worker-datasets"
]

[workspace.dependencies]
actix-web = { version = "4.13.0", features = ["actix-tls", "rustls-0_23"]}
actix-cors = { version = "0.7.1" }
actix-multipart = { version = "0.7.2" }
thiserror = { version = "2.0.18" }
actix-files = {version = "0.6.9", features = ["actix-server"]}
actix-web-prom = {version = "0.10.0", features = ["process"]}
async-nats = { version = "0.49.1" }
async-stream = { version = "0.3.6" }
futures = { version = "0.3.32" }
futures-util = { version = "0.3.32" }
aws-sdk-s3 = {version = "1.136.0", features = ["behavior-version-latest"] }
aws-config = { version = "1.8.18", features = ["rustls", "behavior-version-latest"] }
qdrant-client = { version = "1.18.0"}
sqlx = { version = "0.9.0", features = ["tls-rustls", "postgres", "chrono", "time", "migrate", "macros", "json", "runtime-tokio"], default-features = false }
utoipa = { version = "5.5.0", features = ["actix_extras", "auto_into_responses"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["actix-web", "reqwest", "vendored"]}
utoipa-actix-web = { version = "0.1.2"}
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150" }
anyhow = { version = "1.0.102" }
dotenvy = { version = "0.15.7"}
tracing = { version = "0.1.43"}
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"]}
opentelemetry = { version = "0.32.0"}
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio", "opentelemetry-http", "spec_unstable_metrics_views"]}
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic"] }
opentelemetry-prometheus = { version = "0.32.0" }
opentelemetry-appender-tracing = { version = "0.32.0" }
tracing-opentelemetry = { version = "0.33.0" }
prometheus = { version = "0.14.0" }
mime_guess = { version = "2.0.5" }
quick-xml = {version = "0.40.1", features = ["escape-html"]}
mime = { version = "0.3.17" }
pdf-extract = { version = "0.10.0" }
lopdf = { version = "0.41.0" }
unicode-normalization = { version = "0.1.25" }
unicode-segmentation = { version = "1.13.3" }
scraper = { version = "0.27.0" }
zip = {version = "8.6.0", features = ["deflate", "deflate64", "time", "ppmd", "bzip2"], default-features = false}
uuid = { version = "1.23.3", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
tokio = { version = "1.52.3", features = ["full"] }
reqwest = { version = "0.13.4", features = ["json", "rustls"], default-features = false }
rust-stemmers = {version ="1.2.0" }
stop-words = { version = "0.10.0" }
async-trait = { version = "0.1.89" }
once_cell = "1.21.4"
regex = { version = "1.12.4" }
aes-gcm = { version = "0.10.3" }
rand = { version = "0.10.1" }
base64 = { version = "0.22.1" }
hex = { version = "0.4.3" }
infer = { version = "0.19.0" }
rustls = { version = "0.23.40" }
pem = { version = "3.0.6" }
sha2 = {version = "0.11.0"}
tiktoken-rs = { version = "0.12.0" }
flate2 = { version = "1.1.9" }
tar = { version = "0.4.46" }
mail-parser = { version = "0.11.3" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "webp"] }
rtf-parser = { version = "0.4.3" }
epub = { version = "2.1.5" }
cfb = { version = "0.14.0" }
tree-sitter = { version = "0.26.9" }
tree-sitter-rust = { version = "0.24.2" }
tree-sitter-python = { version = "0.25.0" }
tree-sitter-javascript = { version = "0.25.0" }
tree-sitter-typescript = { version = "0.23.2" }
tree-sitter-go = { version = "0.25.0" }
tree-sitter-java = { version = "0.23.5" }
tree-sitter-c = { version = "0.24.2" }
tree-sitter-cpp = { version = "0.23.4" }
tree-sitter-json = { version = "0.24.8" }
tree-sitter-toml-ng = { version = "0.7.0" }
tree-sitter-yaml = { version = "0.7.2" }
tree-sitter-html = { version = "0.23.2" }
tree-sitter-css = { version = "0.25.0" }
tree-sitter-bash = { version = "0.25.1" }
redis = { version = "1.2.2", features = ["tokio-comp", "tokio-rustls-comp", "connection-manager", "tls-rustls"] }
moka = { version = "0.12.15", features = ["sync"] }
zeroize = { version = "1.9.0", features = ["derive"] }

semantic-explorer-core = { path = "crates/core" }

[profile.dev]
incremental = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
strip = "debuginfo"
lto = true


[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
enum_glob_use = "deny"